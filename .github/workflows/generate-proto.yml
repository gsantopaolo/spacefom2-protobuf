# Regenerate the SpaceFOM .proto files from the pinned FOM modules, validate
# them, and open (or update) a pull request when the output changes.
# Design: docs/plans/generator-ci-plan.md §5 and §6; pull request flow: #19.
name: generate-proto

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate, but do not open a pull request
        type: boolean
        default: false
  push:
    # Opens the update PR. Other branches are checked by the pull_request run
    # below, or by hand with workflow_dispatch and dry_run.
    branches: [main]
    paths:
      - fom/**
      - generator/**
      - buf.yaml
      - tools/generated_output_check.py
      - .github/workflows/generate-proto.yml
  pull_request:
    paths:
      - fom/**
      - generator/**
      - proto/**
      - buf.yaml
      - tools/generated_output_check.py
      - tools/test_generated_output_check.py
      - .github/workflows/generate-proto.yml

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FOM_DIR: build/fom
  # https://github.com/bufbuild/buf/releases/tag/v1.75.0
  BUF_VERSION: "1.75.0"
  # sha256 of buf-Linux-x86_64 (the binary buf-action downloads and checks)
  # from sha256.txt in that release.
  BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b

jobs:
  # Every event: regenerate, then validate the fresh output, so the run that
  # opens the bot PR has already checked it. The bot PR's own pull_request runs
  # start only after a maintainer approves them (GitHub changelog, 2026-06-11:
  # https://github.blog/changelog/2026-06-11-bot-created-pull-requests-can-run-workflows-if-approved/).
  # Read-only: dry runs and pull requests never get write permissions (#4).
  #
  # On a pull request, the committed proto/ may be stale when only the inputs
  # changed; the bot regenerates it after the merge. Hand-edited output that
  # does not match the generator still fails (tools/generated_output_check.py).
  generate:
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - name: Tests for the pull-request decision logic
        run: python -m pytest tools -q
      - name: Fetch pinned FOM modules
        run: PYTHONPATH=generator python -m spacefom_proto fetch --dest "$FOM_DIR"
      - name: Keep a copy of the current proto tree
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          if [ -d proto ]; then cp -R proto "$RUNNER_TEMP/previous/proto"; fi
      - name: Generate
        run: |
          PYTHONPATH=generator python -m spacefom_proto generate \
            --fom-dir "$FOM_DIR" --report "$RUNNER_TEMP/report.md"
      - name: Unit, golden and idempotence tests
        run: SPACEFOM_FOM_DIR="$FOM_DIR" SPACEFOM_REQUIRE_FOM=1 python -m pytest generator/tests -q
      - name: Regenerating again changes nothing
        run: PYTHONPATH=generator python -m spacefom_proto generate --fom-dir "$FOM_DIR" --check
      - name: Fresh output compiles with protoc
        run: python -m grpc_tools.protoc -Iproto --descriptor_set_out=/dev/null proto/siso/spacefom/v1/*.proto
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
          checksum: ${{ env.BUF_SHA256 }}
      - run: buf lint
      - name: buf breaking (WIRE) against the base branch
        env:
          BASE: origin/${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: |
          if git ls-tree -d --name-only "$BASE" proto | grep -q .; then
            buf breaking --against ".git#ref=$BASE"
          else
            echo "No proto/ on $BASE yet; skipping breaking check."
          fi
      - name: Did the generated output change?
        id: diff
        run: |
          git status --porcelain --untracked-files=all -- proto generator/field-ids.lock.json \
            | cut -c4- > "$RUNNER_TEMP/stale.txt"
          if [ -s "$RUNNER_TEMP/stale.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/stale.txt"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull request - is the committed output acceptable?
        if: github.event_name == 'pull_request'
        # `shell: bash` runs with -o pipefail, so a failing check is not hidden by tee.
        shell: bash
        # HEAD is the PR merge commit and HEAD^1 the base it was merged onto, so
        # the list holds only this PR's files even if the base branch moved on.
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          python tools/generated_output_check.py --name proto \
            --output proto/ --output generator/field-ids.lock.json \
            --input fom/ --input generator/ --input buf.yaml \
            --changed "$RUNNER_TEMP/changed.txt" --stale "$RUNNER_TEMP/stale.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Archive the previous proto tree into history/
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          PYTHONPATH=generator python -m spacefom_proto archive \
            --proto "$RUNNER_TEMP/previous/proto" --history history --main-commit "$GITHUB_SHA"
      - name: Summary
        run: |
          echo "Dry run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the result for the pull-request job
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: mkdir -p build && cp "$RUNNER_TEMP/report.md" build/report.md
      - if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proto-update
          path: |
            proto
            history
            generator/field-ids.lock.json
            build/report.md
          retention-days: 3

  # The only job that can write, and only on main.
  pull-request:
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      inputs.dry_run != true
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: generate-proto-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace proto/ with the generated tree
        run: rm -rf proto
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-update
          path: .
      - name: Open or update the pull request
        # No `labels` input: whether the label API creates a missing label is
        # not documented (#5), and nothing depends on the label.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: generator/proto-update
          delete-branch: true
          add-paths: |
            proto/
            history/
            generator/field-ids.lock.json
          commit-message: Regenerate SpaceFOM .proto files
          title: Regenerate SpaceFOM .proto files
          body-path: build/report.md
