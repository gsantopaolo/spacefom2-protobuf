# Check every relative link and #anchor in the tracked Markdown files, so a
# docs-only pull request gets a check too (#29, m9). External links are out of
# scope; see tools/check_links.py.
name: docs-links

on:
  pull_request:
    paths:
      - "**/*.md"
      - tools/check_links.py
      - tools/test_check_links.py
      - .github/workflows/docs-links.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      # The link check needs only the standard library; its tests need pytest,
      # which the generator's hashed lock file pins.
      - run: pip install --require-hashes -r generator/requirements.txt
      - name: Tests for the link check
        run: python -m pytest -q tools/test_check_links.py
      - name: Relative links and anchors resolve
        run: python tools/check_links.py
