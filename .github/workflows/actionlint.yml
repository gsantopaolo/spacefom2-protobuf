# Lint every workflow with actionlint (which also runs shellcheck on `run:`
# steps; shellcheck is preinstalled on ubuntu-latest). Added with #19.
name: actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**

permissions:
  contents: read

env:
  # https://github.com/rhysd/actionlint/releases/tag/v1.7.12
  ACTIONLINT_VERSION: "1.7.12"
  # From actionlint_1.7.12_checksums.txt in that release.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: |
          shellcheck --version | head -2
          "$RUNNER_TEMP/actionlint" -color
