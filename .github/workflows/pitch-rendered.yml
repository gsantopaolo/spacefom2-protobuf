# Fails a pull request that changes proposal/pitch.md without also refreshing
# the committed proposal/pitch.pdf and proposal/pitch.docx (issue #16).
# PDF bytes are not deterministic, so this checks that the files changed
# together rather than comparing rendered output.
name: pitch-rendered

on:
  pull_request:
    paths:
      - proposal/pitch.md
      - proposal/pitch.pdf
      - proposal/pitch.docx
      - tools/check_pitch_rendered.sh
      - tools/test_check_pitch_rendered.sh
      - .github/workflows/pitch-rendered.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the check script
        run: sh tools/test_check_pitch_rendered.sh
      - name: PDF and Word files refreshed with pitch.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "$BASE_SHA" HEAD | sh tools/check_pitch_rendered.sh
