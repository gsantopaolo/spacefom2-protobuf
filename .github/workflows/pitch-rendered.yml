# Fails a pull request that changes proposal/pitch.md without also refreshing
# the committed proposal/pitch.pdf and proposal/pitch.docx (issue #16).
# PDF bytes are not deterministic, so this checks that the files changed
# together rather than comparing rendered output.
name: pitch-rendered

on:
  pull_request:
    paths:
      - proposal/pitch.md
      - proposal/pitch.pdf
      - proposal/pitch.docx
      - tools/check_pitch_rendered.sh
      - tools/test_check_pitch_rendered.sh
      - .github/workflows/pitch-rendered.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its parents, for the diff below.
          fetch-depth: 2
      - name: Test the check script
        run: sh tools/test_check_pitch_rendered.sh
      - name: PDF and Word files refreshed with pitch.md
        # `shell: bash` runs with -o pipefail, so a failing git diff is not hidden.
        shell: bash
        # HEAD is the PR merge commit and HEAD^1 the base it was merged onto, so
        # the list holds only this PR's files even if the base branch moved on.
        run: git diff --name-only HEAD^1 HEAD | sh tools/check_pitch_rendered.sh
