# Regenerate the SpaceFOM .proto files from the pinned FOM modules, validate
# them, and open (or update) a pull request when the output changes.
# Design: docs/plans/generator-ci-plan.md §5 and §6.
name: generate-proto

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate, but do not open a pull request
        type: boolean
        default: false
  push:
    # On main this opens the update PR; on any other branch it is a dry run.
    paths:
      - fom/**
      - generator/**
      - buf.yaml
      - .github/workflows/generate-proto.yml
  pull_request:
    paths:
      - fom/**
      - generator/**
      - proto/**
      - buf.yaml
      - .github/workflows/generate-proto.yml

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FOM_DIR: build/fom

jobs:
  # Pull requests: regenerate, validate, and fail if the committed proto/ is stale.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - name: Fetch pinned FOM modules
        run: PYTHONPATH=generator python -m spacefom_proto fetch --dest "$FOM_DIR"
      - name: Committed output is up to date
        run: PYTHONPATH=generator python -m spacefom_proto generate --fom-dir "$FOM_DIR" --check
      - name: Unit, golden and idempotence tests
        run: SPACEFOM_FOM_DIR="$FOM_DIR" SPACEFOM_REQUIRE_FOM=1 python -m pytest generator/tests -q
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking (WIRE) against the base branch
        run: |
          base="origin/${{ github.base_ref }}"
          if git ls-tree -d --name-only "$base" proto | grep -q .; then
            buf breaking --against ".git#ref=$base"
          else
            echo "No proto/ on $base yet; skipping breaking check."
          fi

  # Push and manual runs: regenerate and validate; if anything changed, archive
  # the previous tree. All validation runs here, because a PR opened with
  # GITHUB_TOKEN does not trigger other workflows (plan §6, step 6).
  # Read-only: dry runs on other branches never get write permissions (#4).
  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - name: Fetch pinned FOM modules
        run: PYTHONPATH=generator python -m spacefom_proto fetch --dest "$FOM_DIR"
      - name: Keep a copy of the current proto tree
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          if [ -d proto ]; then cp -R proto "$RUNNER_TEMP/previous/proto"; fi
      - name: Generate
        run: |
          PYTHONPATH=generator python -m spacefom_proto generate \
            --fom-dir "$FOM_DIR" --report "$RUNNER_TEMP/report.md"
      - name: Unit, golden and idempotence tests
        run: SPACEFOM_FOM_DIR="$FOM_DIR" SPACEFOM_REQUIRE_FOM=1 python -m pytest generator/tests -q
      - name: Regenerating again changes nothing
        run: PYTHONPATH=generator python -m spacefom_proto generate --fom-dir "$FOM_DIR" --check
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking (WIRE) against main
        run: |
          if git ls-tree -d --name-only origin/main proto | grep -q .; then
            buf breaking --against ".git#ref=origin/main"
          else
            echo "No proto/ on main yet; skipping breaking check."
          fi
      - name: Did the generated output change?
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- proto generator/field-ids.lock.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated output is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- proto generator/field-ids.lock.json
          fi
      - name: Archive the previous proto tree into history/
        if: steps.diff.outputs.changed == 'true'
        run: |
          PYTHONPATH=generator python -m spacefom_proto archive \
            --proto "$RUNNER_TEMP/previous/proto" --history history --main-commit "$GITHUB_SHA"
      - name: Summary
        run: |
          echo "Dry run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the result for the pull-request job
        if: steps.diff.outputs.changed == 'true'
        run: mkdir -p build && cp "$RUNNER_TEMP/report.md" build/report.md
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proto-update
          path: |
            proto
            history
            generator/field-ids.lock.json
            build/report.md
          retention-days: 3

  # The only job that can write, and only on main.
  pull-request:
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' &&
      github.ref == 'refs/heads/main' &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: generate-proto-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace proto/ with the generated tree
        run: rm -rf proto
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-update
          path: .
      - name: Open or update the pull request
        # No `labels` input: whether the label API creates a missing label is
        # not documented (#5), and nothing depends on the label.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: generator/proto-update
          delete-branch: true
          add-paths: |
            proto/
            history/
            generator/field-ids.lock.json
          commit-message: Regenerate SpaceFOM .proto files
          title: Regenerate SpaceFOM .proto files
          body-path: build/report.md
